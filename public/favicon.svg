<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- La línea cambia de color según si el navegador está en modo claro u oscuro -->
  <style>
    .linea { stroke: #231D18; }
    @media (prefers-color-scheme: dark) { .linea { stroke: #F0EBE4; } }
  </style>
  <defs>
    <radialGradient id="brillo" cx="30%" cy="28%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="15" fill="#579B54"/>
  <path d="M16 16 L8.5 3.01 A15 15 0 0 1 31 16 Z" fill="#7650C2"/>
  <path d="M16 16 L31 16 A15 15 0 0 1 8.5 28.99 Z" fill="#D86A3F"/>
  <circle cx="16" cy="16" r="15" fill="url(#brillo)"/>
  <g class="linea" fill="none" stroke-width="1.2" stroke-linejoin="round">
    <path d="M8.5 3.01 L16 16 L31 16 M16 16 L8.5 28.99"/>
    <circle cx="16" cy="16" r="14.4"/>
  </g>
</svg>
